name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install development dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest black isort flake8

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,.venv,venv,env,images
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__,.venv,venv,env,images

    - name: Check code formatting with black
      run: black --check . --exclude=".git|__pycache__|.venv|venv|env|images"

    - name: Check import sorting with isort
      run: isort --check-only . --skip=".git|__pycache__|.venv|venv|env|images"

    - name: Run Python scripts (syntax check)
      run: |
        find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./venv/*" -not -path "./env/*" | xargs python -m py_compile

    - name: Test interview problems
      run: |
        python "Some interview problems/P1 Next_permutation.py"